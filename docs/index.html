<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>命題データベース — Forb-LT 1.8</title>
<style>
:root{--ink:#14171a;--soft:#3c4248;--muted:#6b7280;--line:#e3e5e9;--line2:#eef0f3;
 --bg:#fbfbfc;--panel:#fff;--accent:#0e5a63;--accent2:#e9f1f2;--flag:#f4f4f6;--warnbg:#fdf7ef;--warnln:#c8892b}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-direction:column;height:100vh}
header{padding:14px 22px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.top{display:flex;align-items:baseline;gap:14px}
h1{margin:0;font:600 18px/1.3 "Hiragino Mincho ProN","YuMincho",serif;letter-spacing:.02em}
nav{display:flex;gap:2px;margin-left:18px}
nav button{border:0;background:none;padding:8px 12px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.lang{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;font-size:11.5px;color:var(--soft);cursor:pointer}
.sub{padding:6px 0 10px;color:var(--muted);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap}
.sub code{font:11px/1 ui-monospace,Menlo,monospace;color:var(--soft)}
.toolbar{display:flex;gap:10px;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#q{flex:1 1 240px;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fcfcfd;outline:none}
#q:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--soft);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}
.chip:hover{border-color:#c9ced6}.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.spacer{flex:1}.count{color:var(--muted);font-size:12px;white-space:nowrap}
main{flex:1;display:grid;grid-template-columns:390px 1fr;min-height:0}
#list{overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
.item{padding:10px 16px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:10px;align-items:baseline}
.item:hover{background:#f7f9fa}.item.sel{background:var(--accent2);border-left:3px solid var(--accent);padding-left:13px}
.item .n{font:11px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);min-width:24px;text-align:right}
.item .nm{font-family:"Hiragino Mincho ProN","YuMincho",serif;font-size:14px;line-height:1.35}
.item .meta{margin-top:3px;font-size:11px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--flag);font:11px/1.7 ui-monospace,Menlo,monospace;color:var(--soft)}
.ival{font:11px/1.7 ui-monospace,Menlo,monospace;color:var(--soft)}
.kind{font-size:11px;padding:1px 6px;border-radius:4px}
.kind.k-both,.kind.k-exact{background:#eef6f2;color:#1d6b4f}
.kind.k-upper,.kind.k-lower{background:#f3f5f7;color:#4a5560}
#detail{overflow:auto;padding:24px 34px 60px}
.h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.h .num{font:12px/1 ui-monospace,Menlo,monospace;color:var(--muted)}
.h h2{margin:0;font:600 23px/1.35 "Hiragino Mincho ProN","YuMincho",serif}
.tags{margin:9px 0 20px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font:12px/1.6 ui-monospace,Menlo,monospace;padding:2px 8px;border:1px solid var(--line);border-radius:5px;color:var(--soft)}
.tag.tier{border-color:#cfe0e2;background:#f2f8f9;color:#0b4b52}
section{margin:0 0 20px}.k{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.formula{font:13px/1.8 "SFMono-Regular",Menlo,monospace;background:#f7f8f9;border:1px solid var(--line2);border-radius:8px;padding:12px 15px;white-space:pre-wrap;word-break:break-word;color:#20262b}
.txt{font-size:13.4px;line-height:1.8;color:var(--soft)}
.big{font:600 15.5px/1.7 "SFMono-Regular",Menlo,monospace}
.note{border-left:3px solid var(--accent);background:#f5fafb;padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.4px;line-height:1.7}
.note b{color:var(--accent)}
.warn{border-left:3px solid #9aa0a6;background:#f7f7f8;padding:10px 14px;border-radius:0 8px 8px 0;font-size:12.8px;line-height:1.7;color:var(--soft)}
button.act{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--soft)}
button.act:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.presets{padding:22px 26px;overflow:auto}
.presets h3{margin:0 0 4px;font:600 15px/1.5 "Hiragino Mincho ProN",serif}
.presets p.lead{margin:0 0 18px;color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);cursor:pointer;transition:.12s}
.pcard:hover{border-color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pcard .t{font-size:13.5px;font-weight:600}
.pcard .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.pcard .c{font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--accent);margin-top:6px}
.checker{padding:22px 26px;overflow:auto;max-width:900px}
#draft{width:100%;height:190px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;font:13.5px/1.8 "Hiragino Mincho ProN",serif;resize:vertical;background:#fff;outline:none}
#draft:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.row{display:flex;gap:10px;align-items:center;margin:10px 0 16px;flex-wrap:wrap}
.hit{border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin-bottom:9px;background:var(--panel)}
.hit .lbl{font-size:11px;color:var(--muted)}
.hit .quote{font-family:"Hiragino Mincho ProN",serif;font-size:13px;margin:4px 0 8px;padding-left:9px;border-left:2px solid var(--line)}
.hit .who{font-size:13px;font-weight:600}
.hit .why{font-size:12.5px;color:var(--soft);margin-top:5px;line-height:1.7}
.hit .flag{display:inline-block;margin-top:7px;font-size:12px;padding:5px 10px;border-radius:6px;background:var(--warnbg);border:1px solid #ecd9b8;color:#7d5510}
.hit .ok{display:inline-block;margin-top:7px;font-size:12px;padding:5px 10px;border-radius:6px;background:#eef6f2;color:#1d6b4f}
.empty{padding:36px 20px;color:var(--muted);text-align:center;font-size:13px}
footer{border-top:1px solid var(--line);padding:7px 22px;background:var(--panel);color:var(--muted);font-size:11.5px;display:flex;gap:16px;flex-wrap:wrap}
kbd{font:11px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:#fcfcfd}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:42vh 1fr}#list{border-right:none;border-bottom:1px solid var(--line)}#detail{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <h1 id="apptitle">命題データベース</h1>
    <nav>
      <button data-view="list" class="on" id="nav-list">一覧</button>
      <button data-view="presets" id="nav-presets">逆引き</button>
      <button data-view="check" id="nav-check">原稿チェック</button>
    </nav>
    <button class="lang" id="lang">EN</button>
  </div>
  <div class="sub"><span id="sub1">Forb-LT 一覧表 1.8（公開版）・82 命題 ＋ 校正表 10 行</span>
    <span id="sub2">値は文献の写し。新しい定理の主張ではない</span>
    <span>sha256 <code id="sha"></code></span></div>
</header>

<div class="toolbar" id="bar">
  <input id="q" autocomplete="off">
  <div class="chips" id="tiers"></div>
  <div class="chips" id="kinds"></div>
  <div class="spacer"></div><span class="count" id="count"></span>
</div>

<main id="main-list">
  <div id="list"></div>
  <div id="detail"></div>
</main>
<main id="main-presets" style="display:none"><div class="presets" id="presets"></div></main>
<main id="main-check" style="display:none"><div class="checker" id="checker"></div></main>

<footer><span><kbd>/</kbd> <span id="f1">検索</span></span><span><kbd>↑</kbd><kbd>↓</kbd> <span id="f2">移動</span></span>
  <span><kbd>c</kbd> <span id="f3">引用をコピー</span></span><span><kbd>Esc</kbd> <span id="f4">解除</span></span>
  <span id="f5" style="margin-left:auto">版 1.8 / 2026-11-06</span></footer>
</div>

const rank=(x,tbl)=>{const k=String(x).trim().toLowerCase().replace(/\s+/g,'');return tbl[k]===undefined?null:tbl[k]};
function parseA(a){
  a=(a||'').trim(); const m=a.match(/^\[(.+?),(.+?)\]/);
  if(!m) return null;
  const lo=m[1].trim(), up=m[2].trim();
  const loM=lo==='—'||lo==='-', upM=up==='—'||up==='-';
  const rlo=loM?null:rank(lo,FO), rup=upM?null:rank(up,FO);
  const slo=loM?null:rank(lo,SO), sup=upM?null:rank(up,SO);
  const fo = (rlo!==null||rup!==null||loM||upM) && !(slo!==null||sup!==null) ;
  return {lo,up,loM,upM,rlo,rup,slo,sup,scale:(slo!==null||sup!==null)?'so':'fo'};
}
function kindOf(a){
  const p=parseA(a); if(!p) return 'none';
  if(p.loM&&p.upM) return 'none';
  if(p.loM) return 'upper'; if(p.upM) return 'lower';
  return p.lo!==p.up ? 'both' : 'exact';
}

 {id:'iopen-not',ja:'IOpen で証明できない',en:'Not provable in IOpen',d:{ja:'IOpen より強い体系が要る',en:'needs more than IOpen'},
  f:r=>r.iv&&r.iv.scale==='fo'&&r.iv.rlo!==null&&r.iv.rlo>=-3},
 {id:'indep',ja:'独立が分かっている',en:'Independence established',d:{ja:'上下が違い、両方の値がある',en:'both bounds known and different'},
  f:r=>r.kind==='both'},
 {id:'upper',ja:'上界だけ（独立とは言えない）',en:'Upper bound only',d:{ja:'「証明できる」だけが分かっている',en:'only provability is known'},
  f:r=>r.kind==='upper'},
 {id:'so',ja:'二階の体系での値',en:'Second-order values',d:{ja:'RCA₀・WKL₀ のスケール',en:'RCA₀ / WKL₀ scale'},
  f:r=>r.iv&&r.iv.scale==='so'},
 {id:'lin',ja:'証人が線形以下',en:'Witness is linear or less',d:{ja:'軸B の上界が F_1 以下',en:'witness grows at most linearly'},
  f:r=>/F_[01]\]/.test(r.b_fa||'')||/F_[01]\]/.test(r.B||'')},
 {id:'poly',ja:'証人が多項式くらい',en:'Witness roughly polynomial',d:{ja:'軸B の上界が F_2 以下',en:'witness up to F_2'},
  f:r=>/F_[012]\]/.test(r.b_fa||'')||/F_[012]\]/.test(r.B||'')},
 {id:'eps',ja:'証人が F_ε₀ 級',en:'Witness at F_ε₀',d:{ja:'PA で全域と証明できない増え方',en:'growth not provably total in PA'},
  f:r=>/ε₀/.test((r.b_fa||'')+(r.B||''))},
 {id:'blank',ja:'軸A が未記入（文献の穴）',en:'Axis A blank',d:{ja:'まだ値を入れていない行',en:'no value entered yet'},
  f:r=>r.kind==='none'}
];

/* ---------- 一覧 ---------- */
function renderChips(){
  const t=T();
  const tabs=[[ 't82',t.tiers[0] ],['cal',t.tiers[1]]];
  const cntTier={}; all().forEach(r=>cntTier[r.tier]=(cntTier[r.tier]||0)+1);
  document.getElementById('tiers').innerHTML=
    tabs.map(([k,l])=>`<span class="chip ${state.tab===k?'on':''}" data-tab="${k}">${l}</span>`).join('')
    + Object.entries(cntTier).sort((a,b)=>b[1]-a[1]).map(([k,n])=>
      `<span class="chip ${state.tier===k?'on':''}" data-tier="${k}" title="${k}">${k} <span style="opacity:.6">${n}</span></span>`).join('');
  const cntKind={}; all().forEach(r=>cntKind[r.kind]=(cntKind[r.kind]||0)+1);
  document.getElementById('kinds').innerHTML=['both','exact','upper','lower','none'].filter(k=>cntKind[k])
    .map(k=>`<span class="chip ${state.kind===k?'on':''}" data-kind="${k}">${t.kind[k]} <span style="opacity:.6">${cntKind[k]}</span></span>`).join('');
  document.querySelectorAll('[data-tier]').forEach(e=>e.onclick=()=>{state.tier=state.tier===e.dataset.tier?null:e.dataset.tier;render()});
  document.querySelectorAll('[data-kind]').forEach(e=>e.onclick=()=>{state.kind=state.kind===e.dataset.kind?null:e.dataset.kind;render()});
  document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;state.sel=null;render()});
}
function filtered(){
  const q=state.q.toLowerCase();
  return all().filter(r=>{
    if(state.tier&&r.tier!==state.tier) return false;
    if(state.kind&&r.kind!==state.kind) return false;
    if(!q) return true;
    return [r.name,r.prenex,r.A,r.A_src,r.tier,String(r.id)].join('\n').toLowerCase().includes(q);
  });
}
function renderList(rows){
  const el=document.getElementById('list');
  if(!rows.length){el.innerHTML=`<div class="empty">${esc(T().noHit)}</div>`;return}
  el.innerHTML=rows.map(r=>`<div class="item ${String(r.id)===String(state.sel)?'sel':''}" data-id="${r.id}">
    <span class="n">${r.id}</span><span>
    <span class="nm">${esc(r.name)}</span>
    <span class="meta"><span class="badge">${esc(r.tier)}</span>${(r.A&&r.A.trim()&&r.A.trim()!=='未記入')?`<span class="ival">${esc(r.A)}</span>`:''}${r.kind!=='none'?`<span class="kind k-${r.kind}">${T().kind[r.kind]}</span>`:''}</span>
    </span></div>`).join('');
  el.querySelectorAll('.item').forEach(e=>e.onclick=()=>{state.sel=e.dataset.id;render()});
  document.getElementById('count').textContent=rows.length+' 件';
}
function interpretHTML(r){
  const p=r.iv, t=T();
  if(!p||r.kind==='none') return `<div class="warn">${esc(t.interpret.none(r))}</div>`;
  const cls=r.kind==='upper'||r.kind==='none'?'note':'note';
  return `<div class="${cls}">${esc(t.interpret[r.kind](p))}</div>`;
}
function citation(r){
  return `${r.id}. ${r.name}\n階層: ${r.tier}\n式: ${r.prenex}\n軸A: ${r.A}\n${r.b_fa&&r.b_fa!=='—'?'軸B: '+r.b_fa+'\n':''}${r.B&&r.B!=='—'?'軸B: '+r.B+'\n':''}出典: ${r.A_src}\n（Forb-LT 一覧表 1.8 / 値は文献の写し）`;
}
function renderDetail(){
  const el=document.getElementById('detail'), t=T();
  const rows=filtered();
  if(!state.sel){el.innerHTML=`<div class="empty">${L==='ja'?'左の一覧から命題を選んでください。':'Pick a proposition on the left.'}</div>`;return}
  const r=all().find(x=>String(x.id)===String(state.sel))||rows[0];
  if(!r){el.innerHTML='<div class="empty">—</div>';return}
  const bfa=(r.b_fa&&r.b_fa!=='—'&&r.b_fa.trim())?r.b_fa:(r.B&&r.B!=='—'?r.B:'');
  const bsrc=(r.b_fa?r.b_src:r.B_src)||'';
  el.innerHTML=`
    <div class="h"><span class="num">${esc(r.id)}</span><h2>${esc(r.name)}</h2></div>
    <div class="tags"><span class="tag tier">${esc(r.tier)}</span><span class="tag">${esc(r.A)}</span>
      <span class="tag">${esc(t.kind[r.kind])}</span>${r.status?`<span class="tag">${esc(r.status)}</span>`:''}</div>
    <section><div class="k">${L==='ja'?'冠頭形':'Prenex form'}</div><div class="formula">${esc(r.prenex)}</div></section>
    <section><div class="k">${L==='ja'?'軸A（証明できる体系／できない体系）':'Axis A (provable / not provable)'}</div>
      ${interpretHTML(r)}
      ${r.A_src?`<div class="txt" style="margin-top:9px">${esc(r.A_src)}</div>`:''}
      ${r.method?`<div class="txt" style="margin-top:7px;color:var(--muted)">A 下界の論法: ${esc(r.method)}</div>`:''}</section>
    ${bfa?`<section><div class="k">${L==='ja'?'軸B（証人の増え方）':'Axis B (growth of witnesses)'}</div>
      <div class="big">${esc(bfa)}</div>
      ${r.b_grz&&r.b_grz!=='—'?`<div class="txt" style="margin-top:5px">Grzegorczyk: ${esc(r.b_grz)}</div>`:''}
      ${r.B_grz&&r.B_grz!=='—'?`<div class="txt" style="margin-top:5px">Grzegorczyk: ${esc(r.B_grz)}</div>`:''}
      ${bsrc?`<div class="txt" style="margin-top:7px;color:var(--muted)">${esc(bsrc)}</div>`:''}</section>`:''}
    <section><div class="k">${L==='ja'?'この命題を自分の文章で使うとき':'Before you cite it'}</div>
      <div class="warn">${esc(t.useNote)}</div>
      <button class="act" id="cp" style="margin-top:8px">${esc(t.cite)}</button>
      <span id="cpm" style="font-size:12px;color:var(--muted);margin-left:8px"></span></section>`;
  document.getElementById('cp').onclick=async()=>{
    const txt=citation(r);
    try{await navigator.clipboard.writeText(txt);}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
    document.getElementById('cpm').textContent=T().copied;
  };
}

/* ---------- 原稿チェック ---------- */
const ALIAS={ // 命題 ID → 手で足した言い換え（名前から自動で作れないもの）
 1:['三平方','ピタゴラス','pythagoras'],2:['素数','素数の無限','primes','prime'],3:['無理数','√2','sqrt2'],
 6:['ユークリッドの補題','euclid'],7:['算術の基本定理','素因数分解','fundamental theorem of arithmetic'],
 8:['正規表現','オートマトン','regex','regular expression'],13:['整列','比較ソート','comparison sort'],
 14:['四色','four color'],16:['ポアンカレ','poincare'],20:['ヴェイユ','weil'],
 21:['ケプラー','球充填','kepler','sphere packing'],22:['E8','エイト'],23:['リーチ格子','leech'],
 24:['ジョルダン','jordan'],44:['セメレディ','szemeredi','等差数列'],49:['幾何化','geometrization','素分解'],
 62:['ETH','指数時間仮説','exponential time hypothesis'],72:['ヤン＝ミルズ','yang','質量ギャップ','mass gap'],
 77:['P≠NP','P vs NP','SAT'],82:['オイラー定数','euler constant','γ']
};
const CAL_ALIAS={C1:['goodstein','グッドスタイン'],C2:['paris','harrington','パリス','ハリントン','PH 定理'],
 C3:['hydra','ヒドラ','カービー','kirby'],C4:['弱い goodstein','process 1'],C5:['塔','tetration'],
 C6:['hydra 高さ','battle 長'],C7:['kruskal','クラスカル','木埋め込み'],C8:['friedman','フリードマン','FFF'],
 N1:['con(pa)','無矛盾'],N2:['iopen','シェファードソン','shepherdson']};
function indexOfRows(){
  const items=[];
  const push=(r,aliases,src)=>{
    const base=[r.name.replace(/の定理|予想|問題|定理/g,''), ...(aliases||[])];
    items.push({r,terms:base.filter(s=>s&&s.length>=2).map(s=>s.toLowerCase()),src});
  };
  const A2={}; Object.entries(ALIAS).forEach(([k,v])=>A2[k]=v);
  RAW.filter(r=>!r.isCal).forEach(r=>push(r,A2[r.id]||[],'row'));
  RAW.filter(r=>r.isCal).forEach(r=>push(r,CAL_ALIAS[r.id]||[],'cal'));
  return items;
}
const IDX=indexOfRows();
function analyse(text){
  const lines=text.split(/[。．\n]/).map(s=>s.trim()).filter(s=>s.length>=6);
  const out=[];
  for(const line of lines){
    const low=line.toLowerCase();
    const hits=[];
    for(const it of IDX){
      let score=0, hitTerm=null;
      for(const t of it.terms){
        if(t.length>=2 && low.includes(t)){ const s=t.length>=4?3:(t.length===3?2:1); if(s>score){score=s;hitTerm=t;} }
      }
      // 式の断片（∀ 〜 ∃ を含む 8 文字以上）が一致したら加点
      const frag=(it.r.prenex||'').replace(/\s+/g,'');
      if(frag.length>=12){
        for(let i=0;i+12<=frag.length;i+=6){ if(low.replace(/\s+/g,'').includes(frag.slice(i,i+12))){score=Math.max(score,2);hitTerm=hitTerm||'式';break} }
      }
      if(score>0) hits.push({r:it.r,score,term:hitTerm});
    }
    hits.sort((a,b)=> b.score-a.score || (a.r.isCal?1:0)-(b.r.isCal?1:0));
    out.push({line,hits:hits.slice(0,3)});
  }
  return out;
}
function riskOf(line,r){
  const p=r.iv, t=T();
  const claims=/独立|証明でき(ない|ません)|不能|不可能|unprovable|independent/i.test(line);
  if(!claims) return {cls:'ok',msg:t.safe};
  if(!p||r.kind==='none') return {cls:'flag',msg:t.risk};
  if(r.kind==='upper') return {cls:'flag',msg:t.risk};
  if(r.kind==='both'||r.kind==='exact') return {cls:'ok',msg:t.safe};
  return {cls:'ok',msg:t.safe};
}
function renderChecker(){
  const t=T();
  const html=`
    <h3 style="margin:0 0 6px;font:600 15px/1.5 'Hiragino Mincho ProN',serif">${esc(t.h_check)}</h3>
    <p class="lead" style="margin:0 0 14px;color:var(--muted);font-size:12.5px">${esc(t.checkLead)}</p>
    <textarea id="draft" placeholder="${esc(t.draftPh)}"></textarea>
    <div class="row"><button class="act primary" id="run">${esc(t.run)}</button>
      <button class="act" id="clr">${esc(t.clear)}</button><span id="cres" style="font-size:12px;color:var(--muted)"></span></div>
    <div id="hits"></div>`;
  document.getElementById('checker').innerHTML=html;
  document.getElementById('run').onclick=runCheck;
  document.getElementById('clr').onclick=()=>{document.getElementById('draft').value='';document.getElementById('hits').innerHTML='';document.getElementById('cres').textContent=''};
}
function runCheck(){
  const t=T(), text=document.getElementById('draft').value;
  const res=analyse(text);
  const box=document.getElementById('hits');
  const total=res.reduce((n,x)=>n+x.hits.length,0);
  document.getElementById('cres').textContent=`${res.length} 文 / 候補 ${total} 件`;
  if(!total){box.innerHTML=`<div class="empty">${esc(t.noHit)}</div>`;return}
  box.innerHTML=res.filter(x=>x.hits.length).map(x=>`
    <div style="margin:16px 0 6px;font-size:11px;color:var(--muted)">${esc(x.line.slice(0,110))}</div>
    ${x.hits.map(h=>{
      const rk=riskOf(x.line,h.r);
      const sib=x.hits.filter(o=>o!==h && o.r.kind!==h.r.kind);
      const cross=sib.length?`<div class="lbl" style="margin-top:6px">同じ文に ${sib.map(o=>`${o.r.id}（${esc(o.r.A)}）`).join('・')} も当たっている。区間が細かい方を採る。</div>`:'';
      const why=interpretHTML(h.r).replace(/^<div class="[^"]*">/,'').replace(/<\/div>$/,'');
      return `<div class="hit"><div class="lbl">${h.r.id} ・ ${esc(h.r.tier)} ・ ${esc(h.r.A)} ・ 一致「${esc(h.term||'')}」</div>
        <div class="quote">${esc(x.line.slice(0,160))}</div>
        <div class="who">${esc(h.r.name)}</div>
        <div class="why">${why}</div>
        <div class="${rk.cls}">${esc(rk.msg)}</div>${cross}</div>`;
    }).join('')}`).join('');
}

/* ---------- 逆引きの描画 ---------- */
function renderPresets(){
  const el=document.getElementById('presets');
  const allRows=[...all()];
  el.innerHTML=`<h3>${esc(T().h_presets)}</h3>
    <p class="lead">${esc(T().presetsLead)}</p>
    <div class="grid">${PRESETS.map(p=>{
      const n=allRows.filter(p.f).length;
      return `<div class="pcard" data-p="${p.id}"><div class="t">${esc(p[L]||p.ja)}</div>
        <div class="d">${esc(p.d[L]||p.d.ja)}</div><div class="c">${n} 件</div></div>`}).join('')}
    </div><div id="presetout" style="margin-top:22px"></div>`;
  el.querySelectorAll('.pcard').forEach(e=>e.onclick=()=>{
    const p=PRESETS.find(x=>x.id===e.dataset.p);
    const rows=all().filter(p.f);
    document.getElementById('presetout').innerHTML=
      `<div class="k">${esc(p[L]||p.ja)} — ${rows.length} 件</div>`+ (rows.length? rows.map(r=>
        `<div class="hit" style="cursor:pointer" data-go="${r.id}"><div class="who">${r.id} ・ ${esc(r.name)}</div>
         <div class="lbl">${esc(r.tier)} ・ ${esc(r.A)} ・ ${esc(T().kind[r.kind])}</div></div>`).join('')
        : `<div class="empty">${esc(T().noHit)}</div>`);
    document.querySelectorAll('[data-go]').forEach(g=>g.onclick=()=>{
      state.view='list'; state.tab = String(g.dataset.go).match(/^[CN]/)?'cal':'t82';
      state.tier=null; state.kind=null; state.q=''; document.getElementById('q').value='';
      state.sel=g.dataset.go; render();
    });
  });
}

/* ---------- 画面切替 ---------- */
function setView(v){
  state.view=v;
  document.getElementById('main-list').style.display=v==='list'?'grid':'none';
  document.getElementById('main-presets').style.display=v==='presets'?'block':'none';
  document.getElementById('main-check').style.display=v==='check'?'block':'none';
  document.getElementById('bar').style.display=v==='list'?'flex':'none';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='presets') renderPresets();
  if(v==='check') renderChecker();
}
function render(){
  const t=T();
  document.getElementById('q').placeholder=t.q;
  document.getElementById('nav-list').textContent=L==='ja'?'一覧':'List';
  document.getElementById('nav-presets').textContent=t.h_presets;
  document.getElementById('nav-check').textContent=t.h_check;
  document.getElementById('apptitle').textContent=L==='ja'?'命題データベース':'Proposition Database';
  document.getElementById('sub1').textContent=L==='ja'?`Forb-LT 一覧表 1.8（公開版）・82 命題 ＋ 校正表 10 行`:`Forb-LT table 1.8 · 82 propositions + 10 comparison rows`;
  document.getElementById('sub2').textContent=L==='ja'?'値は文献の写し。新しい定理の主張ではない':'Values are transcriptions from the literature. No new theorem is claimed.';
  document.getElementById('f1').textContent=L==='ja'?'検索':'search';
  document.getElementById('f2').textContent=L==='ja'?'移動':'move';
  document.getElementById('f3').textContent=L==='ja'?'引用をコピー':'copy citation';
  document.getElementById('f4').textContent=L==='ja'?'解除':'reset';
  document.getElementById('lang').textContent=L==='ja'?'EN':'日本語';
  renderChips();
  const rows=filtered();
  if(!state.sel&&rows.length) state.sel=rows[0].id;
  if(state.sel&&!rows.some(r=>String(r.id)===String(state.sel))) state.sel=rows.length?rows[0].id:null;
  renderList(rows); renderDetail();
  if(state.view==='presets') renderPresets();
  if(state.view==='check'&&!document.getElementById('draft')) renderChecker();
}
document.getElementById('sha').textContent=DATA.sha256.slice(0,16);
document.getElementById('lang').onclick=()=>{L=L==='ja'?'en':'ja';render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render()});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey) return;
  const typing=document.activeElement.tagName==='TEXTAREA'||document.activeElement.id==='q';
  if(e.key==='/'&&!typing){e.preventDefault();setView('list');document.getElementById('q').focus();return}
  if(e.key==='Escape'){document.getElementById('q').value='';state.q='';state.tier=null;state.kind=null;render();return}
  if(typing) return;
  if(e.key==='c'){const b=document.getElementById('cp');if(b)b.click();return}
  if(['ArrowDown','ArrowUp','j','k'].includes(e.key)){
    const rows=filtered(); if(!rows.length) return; e.preventDefault();
    const i=rows.findIndex(r=>String(r.id)===String(state.sel));
    const n=(e.key==='ArrowDown'||e.key==='j')?Math.min(rows.length-1,i+1):Math.max(0,i-1);
    state.sel=rows[n].id; render();
    const s=document.querySelector('.item.sel'); if(s)s.scrollIntoView({block:'nearest'});
  }
});
setView('list'); render();
